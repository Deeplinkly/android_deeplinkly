name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # No Flutter SDK is installed on this runner, deliberately. If the build
      # ever starts needing one, this job fails - which is the point.
      - name: Build
        run: ./gradlew :deeplinkly:assembleRelease

      - name: Test
        run: ./gradlew :deeplinkly:testReleaseUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: deeplinkly/build/reports/tests/

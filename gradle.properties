android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# android.enableJetifier is deliberately absent. The plugin build set it, but
# nothing here depends on a pre-AndroidX library, and Jetifier rewrites every
# dependency on every build for nothing.

GROUP=com.deeplinkly
POM_ARTIFACT_ID=deeplinkly-android
VERSION_NAME=1.3.0

POM_NAME=Deeplinkly Android SDK
POM_DESCRIPTION=Deep linking, deferred deep linking and attribution for Android.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/Deeplinkly/android_deeplinkly

POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://github.com/Deeplinkly/android_deeplinkly/blob/main/LICENSE
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/Deeplinkly/android_deeplinkly
POM_SCM_CONNECTION=scm:git:git://github.com/Deeplinkly/android_deeplinkly.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/Deeplinkly/android_deeplinkly.git

POM_DEVELOPER_ID=deeplinkly
POM_DEVELOPER_NAME=Deeplinkly
POM_DEVELOPER_URL=https://github.com/Deeplinkly
